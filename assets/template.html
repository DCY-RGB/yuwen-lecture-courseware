<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>语文试卷讲评课件</title>
<style>
/* ================================================================
   讲评工作台 · 设计系统 2.0
   骨架：左侧导航轨 / 顶部信息条 / 双面板正文 / 底部状态条
   ================================================================ */
:root{
 --fs:1;--railw:212px;
 --serif:"Source Han Serif SC","Noto Serif CJK SC","Songti SC","STSong","SimSun",serif;
 --sans:"PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
 --mono:"JetBrains Mono","Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
 --tip-bg:#1a1d21;--tip-ink:#fff;--hl:#ffe27a;--hl-ink:#1a1d21;--loc-bg:#ffd873;--loc-ring:#d99b12;
 --glbg:rgba(176,141,79,.20);
 --shadow:0 12px 34px rgba(20,22,26,.10);--shadow2:0 1px 2px rgba(20,22,26,.05);
}
html{font-size:calc(16px*var(--fs))}
/* 墨池 */
body[data-palette="ink"]{--bg:#f1f1ee;--bg2:#e8e8e3;--card:#ffffff;--card2:#f6f6f2;--ink:#17191c;--sub:#6d7378;--line:#e2e2db;
 --head:#1b2027;--head2:#0f141a;--gold:#b08d4f;--gold-ink:#7a5817;--blue:#2f5d7c;--blue-soft:#eaf1f6;
 --accent:#b3372b;--red-soft:#fbeae7;--green:#2f6f52;--green-soft:#e9f2ed;--amber:#efe0bd;--amber-soft:#faf4e6;--amber-ink:#7a5817;
 --rail:#1b2027;--rail-ink:#d6d9df;--rail-sub:rgba(255,255,255,.52);--rail-line:rgba(255,255,255,.12)}
/* 素笺 */
body[data-palette="snow"]{--bg:#f4f6f9;--bg2:#eceff5;--card:#ffffff;--card2:#f0f3f8;--ink:#151a21;--sub:#626c7a;--line:#e0e5ee;
 --head:#232b36;--head2:#141a22;--gold:#c2a05a;--gold-ink:#7a5817;--blue:#2f6bd8;--blue-soft:#e9eefc;
 --accent:#c0392b;--red-soft:#fbebe9;--green:#2c7a5b;--green-soft:#e7f3ee;--amber:#f0dfb8;--amber-soft:#fbf5e6;--amber-ink:#7a5817;
 --rail:#232b36;--rail-ink:#d6dae1;--rail-sub:rgba(255,255,255,.52);--rail-line:rgba(255,255,255,.12)}
/* 青瓷 */
body[data-palette="bamboo"]{--bg:#eef2f0;--bg2:#e6ecea;--card:#ffffff;--card2:#f2f6f4;--ink:#16201d;--sub:#5c6b66;--line:#dae4e0;
 --head:#1f3b35;--head2:#122420;--gold:#b9a06a;--gold-ink:#6f5a20;--blue:#2e7d6b;--blue-soft:#e5f1ee;
 --accent:#b04a2c;--red-soft:#fbecE5;--green:#2f7d5f;--green-soft:#e6f2ec;--amber:#e9e1bb;--amber-soft:#f6f5e8;--amber-ink:#6b5a1c;
 --rail:#1f3b35;--rail-ink:#d3ded9;--rail-sub:rgba(255,255,255,.5);--rail-line:rgba(255,255,255,.12)}
/* 靛青 */
body[data-palette="indigo"]{--bg:#eff1f8;--bg2:#e8ebf5;--card:#ffffff;--card2:#f3f5fc;--ink:#151a2b;--sub:#5b6478;--line:#dee3f0;
 --head:#1f2a52;--head2:#131a36;--gold:#cfa63f;--gold-ink:#7a5817;--blue:#3b53c8;--blue-soft:#e8ebfb;
 --accent:#cf4436;--red-soft:#fdeae7;--green:#2d7a5e;--green-soft:#e6f3ed;--amber:#f0dfae;--amber-soft:#fbf5e6;--amber-ink:#7a5817;
 --rail:#1f2a52;--rail-ink:#d3d8e8;--rail-sub:rgba(255,255,255,.5);--rail-line:rgba(255,255,255,.12)}
/* 牛皮 */
body[data-palette="ochre"]{--bg:#f4eee2;--bg2:#ece4d3;--card:#fffdf8;--card2:#f6efe1;--ink:#241b12;--sub:#77664f;--line:#e6d9c1;
 --head:#3a2d20;--head2:#241a11;--gold:#c08c3e;--gold-ink:#7a4f10;--blue:#8a5a2b;--blue-soft:#f4e8d6;
 --accent:#9c4a2a;--red-soft:#fbeae2;--green:#4d7550;--green-soft:#eaf2e6;--amber:#f0dca8;--amber-soft:#fbf3dc;--amber-ink:#7a4f10;
 --rail:#3a2d20;--rail-ink:#e2d8c9;--rail-sub:rgba(255,255,255,.48);--rail-line:rgba(255,255,255,.12)}
/* 夜课 */
body[data-palette="night"]{--bg:#101215;--bg2:#0b0d10;--card:#191c21;--card2:#21252c;--ink:#e8e5df;--sub:#9c9992;--line:#2e333c;
 --head:#0b0d10;--head2:#05070a;--gold:#b58f45;--gold-ink:#dfc279;--blue:#8aa9db;--blue-soft:#1e2735;
 --accent:#e0735a;--red-soft:#35211f;--green:#6fbd90;--green-soft:#1a2e24;--amber:#4a3f22;--amber-soft:#262218;--amber-ink:#dfc279;
 --rail:#0b0d10;--rail-ink:#c9ccd3;--rail-sub:rgba(255,255,255,.5);--rail-line:rgba(255,255,255,.10);
 --tip-bg:#f0ece2;--tip-ink:#1a1d21;--hl:#8a7620;--hl-ink:#0f1114;--loc-bg:#7d6412;--loc-ring:#c9a54a;--glbg:rgba(181,143,69,.24);
 --shadow:0 14px 36px rgba(0,0,0,.45);--shadow2:0 1px 2px rgba(0,0,0,.3)}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.75;-webkit-font-smoothing:antialiased}
::selection{background:var(--loc-bg);color:var(--hl-ink)}
#app{display:grid;grid-template-columns:var(--railw) minmax(0,1fr);height:100vh;overflow:hidden}

/* ================= 左侧导航轨 ================= */
#rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;min-height:0;
 border-right:1px solid var(--rail-line)}
.brand{display:flex;align-items:center;gap:.6rem;padding:1.15rem 1rem .95rem}
.brand .mark{width:27px;height:27px;flex:none;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;
 font:600 .95rem/1 var(--serif);border-radius:2px}
.brand b{display:block;font:600 .92rem/1.3 var(--serif);letter-spacing:.14em;color:#fff}
.brand .sub{display:block;font-size:.6rem;letter-spacing:.2em;color:var(--rail-sub);margin-top:3px}
.railhd{padding:0 1rem .5rem;font-size:.6rem;letter-spacing:.24em;color:var(--rail-sub)}

#secnav{display:flex;flex-direction:column;gap:1px;padding:0 .5rem .6rem;overflow:auto;flex:0 1 auto;scrollbar-width:none}
#secnav::-webkit-scrollbar{display:none}
#secnav button{display:grid;grid-template-columns:20px minmax(0,1fr);grid-template-rows:auto auto;gap:0 .5rem;
 text-align:left;border:0;border-left:2px solid transparent;background:transparent;color:var(--rail-sub);
 padding:.44rem .6rem;border-radius:2px;cursor:pointer;font:inherit;transition:.14s}
#secnav button .ri{grid-row:1/3;align-self:center;font:600 .62rem/1 var(--mono);letter-spacing:.04em;opacity:.5}
#secnav button .rt{font-size:.79rem;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#secnav button .rm{font-size:.62rem;letter-spacing:.06em;opacity:.6;margin-top:1px}
#secnav button:hover{background:rgba(255,255,255,.05);color:#fff}
#secnav button.on{background:rgba(255,255,255,.09);border-left-color:var(--gold);color:#fff}
#secnav button.on .ri{opacity:1;color:var(--gold)}
#secnav button.on .rm{opacity:.72}

#railq{border-top:1px solid var(--rail-line);padding:.7rem .8rem .3rem}
.railqhd{display:flex;justify-content:space-between;align-items:baseline;font-size:.6rem;letter-spacing:.2em;
 color:var(--rail-sub);margin-bottom:.5rem}
.railqhd b{font:600 .62rem var(--mono);letter-spacing:.06em;color:var(--rail-ink)}
#qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.qdot{font:500 .66rem/1 var(--mono);height:23px;border:1px solid var(--rail-line);background:transparent;
 color:var(--rail-sub);border-radius:2px;cursor:pointer;padding:0;transition:.13s}
.qdot:hover{color:#fff;border-color:rgba(255,255,255,.45)}
.qdot.done{color:#8fd0ab;border-color:rgba(120,200,160,.45)}
.qdot.bad{color:#e89b86;border-color:rgba(224,115,90,.5)}
.qdot.on{background:var(--gold);border-color:var(--gold);color:#14171b;font-weight:700}

.railstat{margin-top:auto;border-top:1px solid var(--rail-line);padding:.7rem .9rem .55rem}
.rsrow{display:flex;justify-content:space-between;align-items:baseline;font-size:.6rem;letter-spacing:.14em;color:var(--rail-sub)}
.rsrow b{font:600 .66rem var(--mono);letter-spacing:.04em;color:var(--rail-ink)}
.rsbar{height:2px;background:rgba(255,255,255,.14);margin-top:.45rem;border-radius:2px;overflow:hidden}
.rsbar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s ease}
.railfoot{margin-top:0;border-top:1px solid var(--rail-line);padding:.55rem .7rem .7rem;display:flex;gap:5px}
.railfoot button{flex:1;border:1px solid var(--rail-line);background:rgba(255,255,255,.04);color:var(--rail-ink);
 font:inherit;font-size:.64rem;letter-spacing:.04em;padding:.3rem .2rem;border-radius:2px;cursor:pointer;white-space:nowrap}
.railfoot button:hover{background:rgba(255,255,255,.1);color:#fff}
.railfoot button.on{background:var(--gold);border-color:var(--gold);color:#14171b}

/* ---------- 导航轨收放 ---------- */
#app{transition:grid-template-columns .34s cubic-bezier(.4,0,.2,1)}
#app.preload,#app.preload #rail,#app.preload #railtog{transition:none!important}
#rail{overflow:hidden;transition:transform .34s cubic-bezier(.4,0,.2,1),opacity .2s ease}
body.railoff{--railw:0px}
body.railoff #rail{opacity:0;transform:translateX(-24px);pointer-events:none}
#railtog{position:fixed;left:var(--railw);top:50%;transform:translateY(-50%);z-index:55;
 width:16px;height:62px;padding:0;border:1px solid var(--rail-line);border-left:0;
 border-radius:0 7px 7px 0;background:var(--rail);color:var(--gold);cursor:pointer;
 display:grid;place-items:center;box-shadow:2px 0 12px rgba(0,0,0,.12);
 transition:left .34s cubic-bezier(.4,0,.2,1),width .2s ease,background .18s,color .18s,opacity .2s}
#railtog svg{transition:transform .3s ease}
#railtog:hover{background:var(--gold);color:#14171b;border-color:var(--gold);width:21px}
#railtog:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
body.railoff #railtog{left:0;width:13px;height:76px;background:var(--rail);color:var(--gold);
 border-color:var(--gold);border-left:0;border-radius:0 8px 8px 0;
 box-shadow:3px 2px 14px rgba(0,0,0,.22)}
body.railoff #railtog:hover{width:20px}
@keyframes railhint{0%,100%{box-shadow:2px 0 12px rgba(0,0,0,.12)}50%{box-shadow:0 0 0 4px rgba(176,141,79,.42)}}
#railtog.hint{animation:railhint 1.15s ease-in-out 3}
body.railoff #railtog svg{transform:rotate(180deg)}

/* ================= 主区 ================= */
#main{display:flex;flex-direction:column;min-width:0;height:100vh;background:var(--bg)}
.strip{position:relative;flex:none;display:flex;align-items:center;gap:1rem;height:56px;padding:0 1.35rem;
 background:var(--card);border-bottom:1px solid var(--line)}
.stripmain{min-width:0;flex:1}
#title{font:600 .95rem/1.35 var(--serif);letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb{display:flex;gap:.4rem;align-items:center;font-size:.65rem;color:var(--sub);letter-spacing:.09em;margin-top:2px;
 white-space:nowrap;overflow:hidden}
.crumb i{font-style:normal;opacity:.4}
#tag{color:var(--accent);letter-spacing:.1em}
.stripq{display:flex;align-items:center;gap:.55rem;flex:none}
#ring{width:33px;height:33px;border-radius:50%;position:relative;display:grid;place-items:center;
 background:conic-gradient(var(--accent) 0 var(--p,0%),var(--line) var(--p,0%))}
#ring::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--card)}
#qnow{position:relative;font:700 .68rem/1 var(--mono);color:var(--ink)}
.of{font:500 .65rem var(--mono);color:var(--sub)}
.of i{font-style:normal;color:var(--ink)}
#scorebox{font-size:.66rem;letter-spacing:.06em;border:1px solid var(--line);border-radius:2px;padding:2px 7px;color:var(--sub)}
.striptools{display:flex;gap:1px;flex:none;margin-left:.35rem}
.striptools button{width:31px;height:31px;border:0;background:transparent;color:var(--sub);border-radius:2px;
 cursor:pointer;font-size:.95rem;line-height:1;display:grid;place-items:center}
.striptools button:hover{background:var(--card2);color:var(--ink)}
.stripprog{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--accent);transition:width .35s ease}

#banner{display:flex;align-items:center;gap:.6rem;background:var(--amber-soft);color:var(--amber-ink);
 font-size:.68rem;padding:.32rem 1.35rem;border-bottom:1px solid var(--line);flex:none}
#banner .msg{flex:1}
#banner button{background:none;border:0;cursor:pointer;color:inherit;opacity:.6;font-size:1em;padding:0 4px}
#banner button:hover{opacity:1}

.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,47fr) minmax(0,53fr);gap:1.1rem;
 padding:1rem 1.35rem .6rem}
.pane{overflow:auto;min-height:0;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.pane::-webkit-scrollbar{width:8px;height:8px}
.pane::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid var(--bg)}
#right{padding-bottom:1.4rem}

/* ================= 左面板（原文） ================= */
.lcard{background:var(--card);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.ltabs{display:flex;gap:0;padding:0 1.05rem;border-bottom:1px solid var(--line);background:var(--card);overflow-x:auto;scrollbar-width:none}
.ltabs::-webkit-scrollbar{display:none}
.ltabs button{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--sub);font:inherit;
 font-size:.72rem;letter-spacing:.08em;padding:.72rem .8rem .6rem;cursor:pointer;white-space:nowrap;transition:.14s}
.ltabs button:hover{color:var(--ink)}
.ltabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.lbody{padding:1.3rem 1.6rem 1.9rem}

.chips{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin-bottom:.55rem}
.chip{font-size:.65rem;letter-spacing:.06em;padding:1px 7px;border:1px solid var(--line);border-radius:2px;color:var(--sub);background:transparent}
.chip.amber{border-color:var(--gold);color:var(--gold-ink)}
.chip.red{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.solid{background:var(--head);border-color:var(--head);color:#fff}

.ptitle{font:600 1.19rem/1.65 var(--serif);letter-spacing:.06em;margin:.5rem 0 .1rem}
.byline{color:var(--sub);font-size:.7rem;letter-spacing:.08em;margin-bottom:.8rem}
.tipbox{background:transparent;border-left:2px solid var(--gold);border-radius:0;padding:.15rem 0 .15rem .85rem;
 font-size:.76rem;color:var(--sub);margin:.7rem 0 1rem;line-height:1.85}
.legend{border:0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);border-radius:0;
 padding:.4rem 0;font-size:.66rem;color:var(--sub);margin-bottom:.9rem;display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.legend b{color:var(--accent);letter-spacing:.08em}

/* 原文 */
.para{font-family:var(--serif);font-size:1.03rem;line-height:2.15;margin:0 0 .85rem;position:relative;text-align:justify}
.para:last-child{margin-bottom:0}
.pn{display:inline-block;font:700 .58rem var(--mono);color:var(--accent);min-width:1.5em;margin-right:.45em;
 vertical-align:.55em;font-style:normal;text-align:center}
.tbtn{font:600 .56rem var(--sans);border:0;border-bottom:1px solid var(--gold);color:var(--gold-ink);background:transparent;
 padding:0 .2em;margin-left:.45em;cursor:pointer;vertical-align:.2em;letter-spacing:.04em}
.tbtn:hover{background:var(--amber-soft)}
.trans{font:.8rem/1.85 var(--sans);background:var(--card2);border-left:2px solid var(--blue);
 border-radius:0;padding:.5rem .85rem;margin:.4rem 0 .8rem;color:var(--ink)}
.gl{border-bottom:1.5px dotted var(--blue);cursor:pointer;position:relative;background:linear-gradient(transparent 66%,var(--glbg) 66%)}
.gl.char{border-bottom-style:dashed}
.gl:hover{background:linear-gradient(transparent 40%,var(--glbg) 40%)}
.gl.open::after{content:attr(data-g);position:absolute;left:0;top:100%;z-index:12;width:max-content;max-width:17em;
 background:var(--tip-bg);color:var(--tip-ink);font:400 .74rem/1.7 var(--sans);padding:5px 10px;border-radius:3px;
 box-shadow:0 8px 22px rgba(0,0,0,.28);white-space:normal}
.um{background:var(--hl);color:var(--hl-ink);border-radius:1px}
.loc{background:var(--loc-bg);box-shadow:0 0 0 2px var(--loc-ring);border-radius:2px;color:var(--hl-ink);animation:pulse 1.3s 2}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(217,155,18,.26)}}

/* 对照译文 */
.ptable{width:100%;border-collapse:collapse}
.ptable td{padding:.7rem .8rem;vertical-align:top;font-size:.9rem;line-height:1.95;border-bottom:1px solid var(--line)}
.ptable td:first-child{font-family:var(--serif);width:50%;border-right:1px solid var(--line)}
.ptable td:last-child{font-family:var(--sans);font-size:.82rem;color:var(--ink)}
.ptable small{display:block;color:var(--sub);font-size:.6rem;letter-spacing:.12em;margin-bottom:3px;font-family:var(--sans)}
.jump{display:flex;gap:.6rem;align-items:flex-start;padding:.45rem .1rem;border:0;border-bottom:1px dotted var(--line);
 font-size:.8rem;cursor:pointer;background:transparent;color:var(--sub);line-height:1.7;transition:.13s}
.jump:hover{color:var(--ink);padding-left:.35rem}
.jump.on{color:var(--ink);font-weight:600}
.jump b{flex:none;font:600 .66rem/1.7 var(--mono);width:1.5em;text-align:center;color:var(--accent);background:transparent}
.notes{font-size:.7rem;color:var(--sub);border-top:1px solid var(--line);padding-top:.6rem;margin-top:.8rem;line-height:1.9}

/* 结构 / 思路 */
.flow .step{background:transparent;border-left:2px solid var(--line);border-radius:0;padding:.25rem 0 .6rem .9rem;
 margin-bottom:.5rem;font-size:.88rem}
.flow .step b{color:var(--accent);font-family:var(--sans);font-size:.74rem;letter-spacing:.1em;display:block;margin-bottom:2px}
.flow .step small{color:var(--sub);font-size:.68rem}
.thread{background:var(--amber-soft);border-left:2px solid var(--gold);padding:.5rem .8rem;margin-bottom:.8rem;
 border-radius:0;font-size:.86rem}
.thread b{color:var(--gold-ink);font-size:.7rem;letter-spacing:.1em;margin-right:.5em}
.appr h3{margin:0 0 .5rem;font:600 .98rem var(--serif);letter-spacing:.04em;color:var(--ink)}
.appr dl{margin:.5rem 0}
.appr dt{font-weight:600;margin-top:.6rem;color:var(--accent);font-size:.72rem;letter-spacing:.1em}
.appr dd{margin:1px 0 0;font-size:.88rem}
.warn{background:var(--red-soft);border-radius:2px;padding:.45rem .8rem;font-size:.76rem;color:var(--accent);margin-top:.6rem}
.warn b{margin-right:.5em}

/* ================= 右面板（题目） ================= */
.qnav{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:3px;flex-wrap:wrap;
 margin:0 0 1rem;padding:.55rem 0;background:var(--bg);border-bottom:1px solid var(--line)}
.qnav>button{border:1px solid transparent;background:var(--card2);color:var(--sub);font:500 .68rem/1 var(--mono);
 min-width:1.85rem;height:1.85rem;padding:0 .3rem;border-radius:2px;cursor:pointer;transition:.13s}
.qnav>button:hover{background:var(--card);border-color:var(--line);color:var(--ink)}
.qnav>button.on{background:var(--accent);color:#fff;font-weight:700}
.qnav>button.done{box-shadow:inset 0 -2px var(--green)}
.qnav>button.bad{box-shadow:inset 0 -2px var(--accent);color:var(--accent)}
.qnav .sp{flex:1}
.qnav .seg{display:flex;gap:0;margin-left:.4rem;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.qnav .seg button{border:0;border-radius:0;background:var(--card);font-size:.66rem;min-width:auto;padding:0 .6rem;height:1.85rem;font-family:var(--sans)}
.qnav .seg button+button{border-left:1px solid var(--line)}
.qnav .seg button.on{background:var(--head);color:#fff}

.rcard{background:transparent;border:0;border-radius:0;padding:0;margin-bottom:1.8rem;box-shadow:none}
.rcard+.rcard{border-top:1px solid var(--line);padding-top:1.4rem}
.qhead{display:flex;gap:.9rem;align-items:center;margin-bottom:1.1rem;padding-bottom:.7rem;border-bottom:2px solid var(--ink)}
.qhead .no{font:700 2.3rem/1 var(--serif);letter-spacing:-.02em;color:var(--accent);flex:none;min-width:1.6em}
.qmeta{flex:1;min-width:0}
.qkind{font-size:.72rem;letter-spacing:.1em;color:var(--sub)}
.qchips{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.28rem}
.diff{flex:none;font-size:.62rem;letter-spacing:.14em;color:var(--sub);border:1px solid var(--line);padding:2px 6px;border-radius:2px}
.star{flex:none;width:29px;height:29px;border:1px solid var(--line);background:transparent;border-radius:2px;
 cursor:pointer;color:var(--sub);font-size:.9rem;line-height:1;transition:.13s}
.star:hover{color:var(--gold-ink);border-color:var(--gold)}
.star.on{color:var(--gold-ink);border-color:var(--gold);background:var(--amber-soft)}
.stem{font:600 1.06rem/1.95 var(--serif);margin:0 0 1rem;letter-spacing:.01em}

/* 选项：分隔线列表 */
.opts{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.opt{display:flex;gap:.85rem;align-items:flex-start;padding:.7rem .5rem .7rem .75rem;border:0;border-bottom:1px solid var(--line);
 background:transparent;border-radius:0;cursor:pointer;transition:.13s}
.opt:hover{background:var(--card2);padding-left:1rem}
.opt .ol{font:600 .68rem/1 var(--mono);width:1.55rem;height:1.55rem;flex:none;display:grid;place-items:center;
 border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--sub);margin-top:.3rem}
.ot{flex:1;font-family:var(--serif);font-size:1rem;line-height:1.85}
.opt.picked{background:var(--blue-soft);box-shadow:inset 3px 0 var(--blue)}
.opt.picked .ol{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.ok{background:var(--green-soft);box-shadow:inset 3px 0 var(--green)}
.opt.ok .ol{background:var(--green);border-color:var(--green);color:#fff}
.opt.bad{background:var(--red-soft);box-shadow:inset 3px 0 var(--accent)}
.opt.bad .ol{background:var(--accent);border-color:var(--accent);color:#fff}
.obasis{font:.78rem/1.78 var(--sans);margin-top:.35rem;color:var(--sub)}
.obasis b{margin-right:.5em;padding:0 .4em;border-radius:2px;color:#fff;background:var(--green);font-size:.9em;letter-spacing:.04em}
.obasis b.r{background:var(--accent)}
.obasis .bs{color:var(--sub)}

/* 按钮 */
.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1.1rem;align-items:center}
.btn{font:inherit;font-size:.72rem;letter-spacing:.06em;border:1px solid var(--line);background:var(--card);color:var(--sub);
 border-radius:2px;padding:.4rem 1rem;cursor:pointer;transition:.13s}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--sub)}
.btn.ghost:hover{border-color:var(--ink);color:var(--ink);background:transparent}
.btn.locbtn{border-color:var(--gold);color:var(--gold-ink)}
.btn.locbtn:hover{background:var(--amber-soft);border-color:var(--gold);color:var(--gold-ink)}
.btn.on{background:var(--head);color:#fff;border-color:var(--head)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.qfoot{display:flex;justify-content:space-between;gap:.6rem;margin-top:1.4rem;padding-top:.9rem;border-top:1px solid var(--line)}
.evnote{font-size:.72rem;color:var(--gold-ink);background:var(--amber-soft);border-radius:2px;padding:.3rem .7rem;margin-top:.5rem}

/* 答案板 */
.reveal{margin-top:1.1rem;border:1px solid var(--line);border-top:2px solid var(--head);background:var(--card);
 border-radius:0;padding:0;overflow:hidden}
.reveal>div{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:.9rem;padding:.6rem 1rem;border-bottom:1px solid var(--line);margin:0}
.reveal>div:last-child{border-bottom:0}
.reveal .lbl,.stdans .lbl,.mine .lbl{font-size:.62rem;font-weight:700;color:var(--sub);letter-spacing:.14em}
.reveal .ans b{font-size:1.15rem;color:var(--accent);letter-spacing:.14em}
.reveal ol{margin:.1rem 0 0;padding-left:1.3em}
.reveal .method,.reveal .pit{display:block}
.verdict{grid-column:1/-1;font-weight:700;font-size:.88rem}
.verdict.good{color:var(--green)}
.verdict.bad{color:var(--accent)}
.method{background:var(--card2);border-left:2px solid var(--blue);padding:.5rem .85rem;margin:.2rem 0}
.method h4{margin:0 0 .3rem;font-size:.7rem;color:var(--blue);letter-spacing:.12em}
.method ol{margin:0;padding-left:1.3em;font-size:.84rem;line-height:1.9}
.pit{background:var(--red-soft);padding:.45rem .85rem;font-size:.8rem;color:var(--accent)}
.pit b{margin-right:.6em}

/* 默写 */
.subhead{font-size:.64rem;color:var(--sub);margin-bottom:.3rem;letter-spacing:.12em}
.substem{font:1rem/1.95 var(--serif);margin-bottom:.7rem}
.blank{display:flex;gap:.55rem;align-items:center;margin:.5rem 0}
.bl{flex:none;font:700 .64rem/1 var(--mono);color:var(--accent);background:transparent;padding:.32rem .1rem;letter-spacing:.02em}
textarea,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:2px;padding:.45rem .8rem;width:100%;transition:.14s}
textarea:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--red-soft)}
textarea{min-height:5.5em;resize:vertical;font-family:var(--serif)}
.stdans{font:1rem var(--serif);padding:.15rem 0 .15rem 4.2em;margin-top:.35rem}
.stdans .lbl{margin-left:-4.2em}
.hot{color:var(--accent);font-weight:900;border-bottom:2px solid var(--accent)}
.hotnote{font-size:.7rem;color:var(--accent);padding-left:4.2em;margin-top:2px}
.mine{font:.95rem var(--serif);padding:.15rem 0 .15rem 4.2em;margin-bottom:.3rem}
.mine .lbl{margin-left:-4.2em}
.mine b{margin-left:.7em;font:700 .66rem var(--sans)}
.mine.good b{color:var(--green)}
.mine.bad b{color:var(--accent)}
.wrong{color:var(--accent);text-decoration:line-through;font-weight:700}
.miss{color:var(--accent);font-size:.68rem;margin-left:.5em;font-family:var(--sans)}

/* 写作 */
.wtabs{display:flex;gap:0;flex-wrap:wrap;margin-bottom:1.1rem;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--card)}
.wtabs button{border:0;border-right:1px solid var(--line);background:transparent;color:var(--sub);font:inherit;
 font-size:.74rem;letter-spacing:.06em;padding:.55rem 1rem;cursor:pointer;flex:1;white-space:nowrap}
.wtabs button:last-child{border-right:0}
.wtabs button:hover{background:var(--card2);color:var(--ink)}
.wtabs button:hover{color:var(--ink)}
.wtabs button.on{background:var(--head);color:#fff;font-weight:600}
.wbox h4{margin:.9rem 0 .35rem;color:var(--accent);font-size:.72rem;letter-spacing:.12em}
.wbox ul,.wbox ol{margin:.3rem 0;padding-left:1.4em}
.wbox p{margin:.35rem 0}
.wcard{background:var(--card2);border:0;border-left:2px solid var(--line);border-radius:0;padding:.5rem .85rem;margin-bottom:.5rem;font-size:.88rem}
.wcard b.t{color:var(--accent);font-size:.72rem;margin-right:.4em;letter-spacing:.08em}
.model{display:grid;grid-template-columns:3fr 2fr;gap:.5rem 1.1rem}
.model .mp{font:.98rem/2.05 var(--serif);text-indent:2em}
.model .mc{font-size:.72rem;line-height:1.8;background:var(--card2);border-radius:2px;padding:.4rem .7rem;align-self:start;color:var(--ink)}
.lock{text-align:center;padding:2.2rem;color:var(--sub);border:1px dashed var(--line);border-radius:2px;font-size:.86rem}
.rub{width:100%;border-collapse:collapse;font-size:.8rem}
.rub td,.rub th{border:1px solid var(--line);padding:.4rem .65rem;text-align:left;vertical-align:top}
.rub th{background:var(--card2);color:var(--ink);font-size:.72rem;letter-spacing:.08em;font-weight:600}

/* ================= 底部状态条 ================= */
#statusbar{flex:none;height:42px;display:flex;align-items:center;gap:.15rem;padding:0 .8rem;
 background:var(--head);color:#fff;border-top:1px solid var(--head2)}
#statusbar button{border:0;background:transparent;color:rgba(255,255,255,.72);font:inherit;font-size:.7rem;
 letter-spacing:.05em;padding:.34rem .55rem;border-radius:2px;cursor:pointer;white-space:nowrap;transition:.13s}
#statusbar button:hover{background:rgba(255,255,255,.12);color:#fff}
#statusbar button.on{background:var(--gold);color:#14171b;font-weight:600}
#statusbar button[disabled]{opacity:.35;cursor:not-allowed}
#statusbar .sp{flex:1}
#statmeta{font:500 .64rem var(--mono);letter-spacing:.08em;color:rgba(255,255,255,.45);padding:0 .5rem}
#dsize{font:500 .64rem var(--mono);color:rgba(255,255,255,.6);padding:0 .3rem}
#statusbar .divider{width:1px;height:16px;background:rgba(255,255,255,.18);margin:0 .35rem}

/* ================= 工具面板 ================= */
#dock{position:fixed;right:1.1rem;bottom:52px;z-index:36}
.toolpanel{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:.7rem;
 box-shadow:0 20px 55px rgba(10,12,16,.26);width:clamp(320px,26vw,392px)}
.tphead{display:flex;justify-content:space-between;align-items:center;font-size:.6rem;letter-spacing:.2em;
 color:var(--sub);padding:0 .15rem .5rem}
.tphead b{font:600 .6rem var(--mono);letter-spacing:.1em}
.toolgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.tile{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:2px;padding:.5rem .2rem;
 cursor:pointer;font:inherit;font-size:.66rem;letter-spacing:.03em;display:flex;flex-direction:column;align-items:center;
 gap:.22rem;transition:.13s;line-height:1.35;white-space:nowrap}
.tile i{font-style:normal;font-size:1rem;opacity:.85;line-height:1}
.tile .tl{font-size:.66rem;letter-spacing:.04em}
.tile:hover{border-color:var(--accent);color:var(--accent)}
.tile.on{background:var(--head);color:#fff;border-color:var(--head)}
.tile[disabled]{opacity:.35;cursor:not-allowed}
.fsrow{display:flex;align-items:center;justify-content:space-between;margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--line);
 font-size:.62rem;color:var(--sub);letter-spacing:.1em}
.fsrow .fs{display:flex;align-items:center;gap:.2rem}
.fsrow .fs button{border:1px solid var(--line);background:var(--card2);color:var(--ink);width:24px;height:22px;
 border-radius:2px;cursor:pointer;font-size:.7rem;line-height:1}
.fsrow .fs span{font:600 .66rem var(--mono);min-width:3em;text-align:center;color:var(--ink)}

/* ================= 覆盖层 ================= */
#ovl{position:fixed;inset:0;z-index:70;background:rgba(16,18,20,.46);backdrop-filter:blur(4px);
 display:flex;align-items:center;justify-content:center;padding:1.6rem}
#ovlBox{background:var(--card);color:var(--ink);border-radius:3px;box-shadow:0 30px 80px rgba(0,0,0,.4);
 width:min(880px,100%);max-height:86vh;overflow:auto;padding:1.2rem 1.6rem 1.6rem;border:1px solid var(--line)}
.ovlhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;padding-bottom:.65rem;
 border-bottom:1px solid var(--line);position:sticky;top:-1.2rem;background:var(--card);z-index:2;padding-top:.2rem}
.ovlhead h3{margin:0;font:600 1rem var(--serif);letter-spacing:.06em}
.ovlhead .x{border:1px solid var(--line);background:transparent;border-radius:2px;width:30px;height:30px;
 cursor:pointer;color:var(--sub);font-size:.85rem;line-height:1}
.ovlhead .x:hover{border-color:var(--accent);color:var(--accent)}
.shsec{margin-bottom:1rem}
.shsec .shname{font-size:.66rem;color:var(--sub);margin-bottom:.45rem;letter-spacing:.12em;display:flex;gap:.5rem;align-items:center}
.shsec .shname b{color:var(--ink)}
.shq{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);border-radius:2px;
 padding:.28rem .7rem;font-size:.74rem;margin:0 .3rem .3rem 0;cursor:pointer;background:transparent;color:var(--ink);transition:.13s;
 font-family:inherit}
.shq:hover{border-color:var(--ink)}
.shq.ok{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
.shq.bad{background:var(--red-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.shq.rev{background:var(--amber-soft);border-color:var(--gold);color:var(--gold-ink)}
.shq.on{box-shadow:inset 0 -2px var(--accent)}
.shq i{font-style:normal;font-size:.82em;opacity:.8}
.shstat{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.1rem}
.shstat .s{flex:1;min-width:6.5rem;background:var(--card2);border:1px solid var(--line);border-radius:2px;padding:.55rem .8rem}
.shstat .s b{display:block;font:700 1.35rem/1.2 var(--serif)}
.shstat .s span{font-size:.62rem;color:var(--sub);letter-spacing:.12em}
.shstat .s.g b{color:var(--green)}
.shstat .s.r b{color:var(--accent)}
.shstat .s.a b{color:var(--gold-ink)}
.shfilter{display:flex;gap:.3rem;margin-bottom:.9rem}
.shfilter button{font:inherit;font-size:.7rem;border:1px solid var(--line);background:transparent;color:var(--sub);
 border-radius:2px;padding:.24rem .8rem;cursor:pointer}
.shfilter button.on{background:var(--head);color:#fff;border-color:var(--head)}

/* 搜索 */
.srinput{display:flex;gap:.4rem;align-items:center;margin-bottom:.9rem}
.srinput input{font-size:.9rem;padding:.5rem .8rem}
.srh{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;
 padding:.5rem .2rem;margin-bottom:0;cursor:pointer;font:inherit;color:var(--ink);transition:.13s}
.srh:hover{background:var(--card2);padding-left:.7rem}
.srh .t{font-size:.66rem;color:var(--sub);letter-spacing:.06em;margin-bottom:2px}
.srh .t b{color:var(--accent)}
.srh .x{font-size:.86rem;line-height:1.7}
.srh mark{background:var(--loc-bg);color:var(--hl-ink);padding:0 2px;border-radius:2px}
.srempty{color:var(--sub);font-size:.82rem;padding:1.6rem 0;text-align:center}

/* 打印 / 帮助 */
.optgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1rem}
.pcard{border:1px solid var(--line);background:transparent;border-radius:2px;padding:.75rem .85rem;cursor:pointer;transition:.13s}
.pcard:hover{border-color:var(--ink)}
.pcard.on{border-color:var(--accent);background:var(--red-soft)}
.pcard b{display:block;font-size:.82rem;margin-bottom:.15rem}
.pcard span{font-size:.66rem;color:var(--sub);line-height:1.65;display:block}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:2px;
 padding:0 .4rem;font:600 .68rem/1.75 var(--mono);background:var(--card2);color:var(--ink);margin-right:.25rem}
.ktable{width:100%;border-collapse:collapse;font-size:.82rem}
.ktable td{padding:.34rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}
.ktable td:first-child{width:42%;white-space:nowrap}

/* ================= 白板 / 朗读 ================= */
#board{position:fixed;inset:0;z-index:26;touch-action:none;cursor:crosshair;display:none}
body.board #board{display:block}
#boardbar{position:fixed;left:50%;bottom:54px;transform:translateX(-50%);z-index:41;display:none;
 background:var(--card);border:1px solid var(--line);border-radius:3px;padding:.35rem;gap:.3rem;
 box-shadow:0 14px 40px rgba(0,0,0,.26);align-items:center}
body.board #boardbar{display:flex}
#boardbar button{font:inherit;font-size:.7rem;border:1px solid var(--line);background:transparent;
 color:var(--ink);border-radius:2px;padding:.28rem .7rem;cursor:pointer}
#boardbar button.on{background:var(--head);color:#fff;border-color:var(--head)}
#boardbar .sw{width:20px;height:20px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer}
#boardbar .sw.on{box-shadow:0 0 0 2px var(--ink)}
#boardbar .sp{width:1px;height:18px;background:var(--line);margin:0 .2rem}
#speakbar{position:fixed;left:50%;bottom:54px;transform:translateX(-50%);z-index:40;display:flex;gap:.3rem;
 background:var(--card);border:1px solid var(--line);border-radius:3px;padding:.35rem .45rem;align-items:center;
 box-shadow:0 14px 40px rgba(0,0,0,.2)}
body.board #speakbar{bottom:104px}
#speakbar button{font:inherit;font-size:.7rem;border:1px solid var(--line);background:transparent;color:var(--ink);
 border-radius:2px;padding:.28rem .7rem;cursor:pointer}
#speakbar button:hover{border-color:var(--accent);color:var(--accent)}
#speakbar button.on{background:var(--head);color:#fff;border-color:var(--head)}
#speakbar .lbl{font-size:.64rem;color:var(--sub);letter-spacing:.14em;padding:0 .3rem}
#speakbar .sp{width:1px;height:16px;background:var(--line);margin:0 .15rem}
#speakbar #sprate{font:600 .66rem var(--mono);color:var(--sub);min-width:2.4em;text-align:center}

/* ================= 笔记本 / 封面 / 提示 ================= */
#notes{position:fixed;left:calc(var(--railw) + 1.1rem);bottom:56px;width:322px;background:var(--card);
 border:1px solid var(--line);border-radius:3px;padding:.7rem .8rem;box-shadow:0 18px 46px rgba(10,12,16,.24);z-index:30}
#notes .nh{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem}
#notes .nh b{font-size:.68rem;letter-spacing:.12em}
#notes textarea{min-height:8rem;font-size:.82rem;font-family:var(--sans)}
#cover{position:fixed;inset:0;z-index:80;background:var(--rail);color:#fff;display:flex;flex-direction:column;
 align-items:flex-start;justify-content:center;text-align:left;cursor:pointer;padding:0 9vw}
#cover::before{content:"语文 · 试卷讲评工作台";position:absolute;top:9vh;left:9vw;font-size:.68rem;
 letter-spacing:.34em;color:var(--gold)}
#cover .pill{border:1px solid var(--rail-line);color:var(--gold);font-size:.66rem;letter-spacing:.22em;
 padding:3px 11px;border-radius:0}
#cover h1{font:600 clamp(2.1rem,4.2vw,3.9rem)/1.34 var(--serif);letter-spacing:.06em;margin:1.1rem 0 0;max-width:22em}
#cover .rule{width:100%;max-width:520px;height:1px;background:var(--rail-line);margin:1.6rem 0;position:relative}
#cover .rule::after{content:"";position:absolute;left:0;top:0;width:74px;height:1px;background:var(--gold)}
#cover p{color:rgba(255,255,255,.62);font-size:.8rem;letter-spacing:.16em;margin:0;line-height:2}
#cover .hint{position:absolute;bottom:9vh;left:9vw;font-size:.66rem;letter-spacing:.2em;color:rgba(255,255,255,.38);margin:0}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:var(--tip-bg);color:var(--tip-ink);
 padding:.65rem 1.7rem;border-radius:2px;font:600 .95rem var(--sans);z-index:90;box-shadow:0 16px 44px rgba(0,0,0,.34);
 letter-spacing:.05em;max-width:70vw;text-align:center}
[hidden]{display:none!important}
#print-root{display:none}
.cols.solo{grid-template-columns:minmax(0,1fr)}
.cols.solo #left{display:none}

/* ================= 响应式 ================= */
@media (max-width:1280px){:root{--railw:190px}}
@media (max-width:1120px){
 :root{--railw:64px}
 .brand{justify-content:center;padding:1rem .2rem .8rem}
 .brand .txt{display:none}
 .railhd{display:none}
 #secnav{padding:0 .3rem .5rem}
 #secnav button{grid-template-columns:1fr;justify-items:center;border-left:2px solid transparent;padding:.45rem .1rem}
 #secnav button .rt,#secnav button .rm{display:none}
 #secnav button .ri{grid-row:auto;font-size:.74rem;opacity:.85}
 #railq{display:none}
 .railstat{padding:.55rem .45rem .35rem}
 .rsrow{display:none}
 .railfoot{flex-direction:column;padding:.4rem .3rem .5rem}
 .railfoot button{font-size:.58rem;padding:.28rem .1rem}
 .cols{grid-template-columns:minmax(0,48fr) minmax(0,52fr);gap:.8rem;padding:.8rem}
 .strip{padding:0 .9rem;gap:.6rem}
}
@media (max-width:940px){
 .cols{grid-template-columns:1fr;overflow:auto;gap:.7rem}
 .pane{overflow:visible}
 .optgrid{grid-template-columns:1fr}
 .model{grid-template-columns:1fr}
 .stripq{display:none}
}
@media print{
 @page{margin:15mm 14mm}
 body{background:#fff;color:#000;font-size:10.5pt;line-height:1.8}
 #app,#rail,#railtog,#main,#statusbar,#dock,#notes,#cover,#toast,#ovl,#board,#boardbar,#speakbar{display:none!important}
 #print-root{display:block;font-family:var(--serif);color:#000}
 #print-root h1{font-size:17pt;text-align:center;margin:0 0 4pt}
 #print-root .meta{text-align:center;font-size:9pt;color:#555;margin-bottom:14pt}
 #print-root h2{font-size:13pt;border-bottom:1.5pt solid #333;margin:16pt 0 8pt;padding-bottom:3pt}
 #print-root h3{font-size:11pt;margin:10pt 0 4pt}
 #print-root p{margin:0 0 4pt;text-indent:0}
 #print-root .q{break-inside:avoid;margin:9pt 0 12pt}
 #print-root .a{background:#f4f4f4;padding:5pt 9pt;font-size:9.5pt;border-left:3pt solid #666;margin-top:4pt}
 #print-root .line{border-bottom:.7pt dashed #b9b9b9;height:26pt}
 #print-root .idline{display:flex;gap:24pt;font-size:9.5pt;color:#333;margin-bottom:10pt}
 #print-root .idline span{flex:1;border-bottom:.6pt solid #999;padding-bottom:2pt}
}

<script>
const EXAM = /*__EXAM_DATA__*/null;
(function(){
'use strict';
const E=EXAM;
if(!E){document.body.innerHTML='<p style="padding:2em">未注入试卷数据：请用 scripts/build_courseware.py 生成课件。</p>';return;}
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\n/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const CN='①②③④⑤⑥⑦⑧⑨⑩';

/* ---------- 本地存储 ---------- */
const SK='yw:'+(E.meta&&E.meta.title||'课件')+':';
const S={
  get(k,d){try{const v=localStorage.getItem(SK+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  put(k,v){try{localStorage.setItem(SK+k,JSON.stringify(v))}catch(e){}}
};

/* ---------- 配色 ---------- */
const PAL=['ink','snow','bamboo','indigo','ochre','night'];
const PALNAME={ink:'墨池',snow:'素笺',bamboo:'青瓷',indigo:'靛青',ochre:'牛皮',night:'夜课'};

/* ---------- 规范化数据 ---------- */
const PK={}, QDOC={};
E.meta=E.meta||{};
E.sections=E.sections||[];
E.sections.forEach((s,i)=>{
  s._i=i; s.id=s.id||'s'+(i+1); s.passages=s.passages||[]; s.questions=s.questions||[];
  s.passages.forEach((p,j)=>{
    p.id=p.id||s.id+'-t'+(j+1);
    (p.paragraphs||[]).forEach((pp,k)=>{pp.id=pp.id||'p'+(k+1);pp.key=p.id+'/'+pp.id;PK[pp.key]=pp.text;});
  });
  s.questions.forEach((q,j)=>{
    q.no=q.no==null?j+1:q.no; q.id=q.id||s.id+'-q'+q.no; q.score=q.score||0; q._si=i; q._qi=j;
    if(!q.type) q.type=q.options?'choice':q.subs?'dictation':q.writing?'writing':'subjective';
    QDOC[q.id]=q;
  });
});
const ALLQ=E.sections.flatMap(s=>s.questions);
const TOTALQ=ALLQ.length;

/* ---------- 状态 ---------- */
const state={
  mode:'teacher',si:0,qi:0,view:'single',leftTab:'text',reveal:false,revealQ:{},submitted:{},locate:{},
  annotate:false,fs:1,pick:{},text:{},dict:{},subRev:{},subIdx:{},openTrans:{},userMarks:{},wtab:{},
  timer:{run:false,sec:0,h:null},cd:{run:false,left:0,h:null},drawn:{},bannerOff:false,scrollLoc:false,
  pal:S.get('palette',E.meta.palette||'ink'),star:S.get('star',{}),sheetFilter:'all',
  board:{on:false,erase:false,color:'#e0322b',size:4,szi:1,strokes:{},drawing:false,cur:null},
  speak:{rate:S.get('rate',1),on:false,paused:false,text:''},
  railOff:S.get('railoff',null),ovl:null,printMode:'full'
};
if(PAL.indexOf(state.pal)<0)state.pal='ink';
let railFirst=false;
if(state.railOff===null){state.railOff=window.innerWidth<1080;railFirst=true}
const sec=()=>E.sections[state.si];
const curQ=()=>sec().questions[state.qi];
const passageOf=q=>{if(!q)return null;const s=E.sections[q._si];return s.passages.find(p=>p.id===q.passage)||s.passages[0]};
const revealed=q=>!!q&&((state.mode==='teacher'&&state.reveal)||!!state.revealQ[q.id]);
const ansSet=q=>String(q.answer||'').toUpperCase().replace(/[^A-Z]/g,'').split('').filter(Boolean);
const isStar=q=>state.star[q.id]!==undefined?!!state.star[q.id]:!!q.star;

/* ---------- 判分 ---------- */
const PUNCT=/[\s，。、；：！？“”‘’《》（）()\[\]【】,.;:!?"'—…·\-_]/g;
const normalize=s=>String(s||'').replace(PUNCT,'');
function lcsMask(a,b){
  const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ma=new Array(n).fill(false),mb=new Array(m).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){ma[i]=mb[j]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  return [ma,mb];
}
const blankOK=(b,v)=>{const x=normalize(v);return !!x&&(x===normalize(b.answer)||(b.alt||[]).some(a=>normalize(a)===x))};
function dictOK(q){
  let any=false,ok=true;
  (q.subs||[]).forEach((sub,si)=>sub.blanks.forEach((b,bi)=>{
    const k=q.id+'.'+si+'.'+bi,v=state.dict[k];
    if(v!=null&&String(v).trim()!==''){any=true;if(!blankOK(b,v))ok=false}
  }));
  return any?ok:null;
}
function qStatus(q){
  if(q.type==='choice'){
    if(!state.submitted[q.id])return revealed(q)?'rev':'todo';
    const a=ansSet(q),p=state.pick[q.id]||[];
    return (p.length===a.length&&a.every(k=>p.includes(k)))?'ok':'bad';
  }
  if(q.type==='dictation'){
    const judged=Object.keys(state.subRev).some(k=>k.indexOf(q.id+'.')===0);
    if(!judged)return revealed(q)?'rev':'todo';
    const ok=dictOK(q);return ok?'ok':(ok===false?'bad':'rev');
  }
  return revealed(q)?'rev':'todo';
}
function scoreInfo(){
  let got=0,judged=0,total=0;
  ALLQ.forEach(q=>{
    total+=q.score;
    if(q.type==='choice'&&state.submitted[q.id]){
      judged+=q.score;const a=ansSet(q),p=state.pick[q.id]||[];
      if(p.length===a.length&&a.every(k=>p.includes(k)))got+=q.score;
      else if(a.length>1&&p.length&&p.every(k=>a.includes(k)))got+=Math.floor(q.score/2);
    }
    if(q.type==='dictation'){
      const n=(q.subs||[]).reduce((t,x)=>t+x.blanks.length,0)||1,per=q.score/n;
      (q.subs||[]).forEach((sub,si)=>{if(!state.subRev[q.id+'.'+si])return;
        sub.blanks.forEach((b,bi)=>{judged+=per;if(blankOK(b,state.dict[q.id+'.'+si+'.'+bi]))got+=per})});
    }
  });
  const r=x=>Math.round(x*10)/10;return {got:r(got),judged:r(judged),total:r(total)};
}

/* ---------- 原文标记 ---------- */
function buildMarks(pp,ctx){
  const acc=[],free=(s,e)=>acc.every(m=>e<=m.s||s>=m.e);
  const add=(s,e,cls,attrs)=>{if(s>=0&&free(s,e))acc.push({s,e,cls,attrs:attrs||''})};
  (ctx.evidence||[]).forEach(ev=>{
    if(ev.para&&ev.para!==pp.id)return;const k=pp.text.indexOf(ev.quote);
    if(k>=0)add(k,k+ev.quote.length,'loc');
  });
  (state.userMarks[pp.key]||[]).forEach(t=>{const k=pp.text.indexOf(t);if(k>=0)add(k,k+t.length,'um','title="双击取消标注"')});
  (ctx.glosses||[]).forEach(g=>{let from=0;
    for(;;){const k=pp.text.indexOf(g.term,from);if(k<0)break;add(k,k+g.term.length,'gl '+(g.kind==='char'?'char':'word'),'data-g="'+esc(g.gloss)+'"');from=k+g.term.length}
  });
  return acc;
}
function markedHTML(text,marks){
  marks.sort((a,b)=>a.s-b.s);let out='',i=0;
  marks.forEach(m=>{if(m.s<i)return;out+=esc(text.slice(i,m.s))+'<span class="'+m.cls+'" '+m.attrs+'>'+esc(text.slice(m.s,m.e))+'</span>';i=m.e});
  return out+esc(text.slice(i));
}
function evidenceCtx(p){
  return sec().questions.filter(q=>state.locate[q.id]&&passageOf(q)===p).flatMap(q=>q.evidence||[]);
}
function paraHTML(p,pp,idx){
  const body=markedHTML(pp.text,buildMarks(pp,{evidence:evidenceCtx(p),glosses:p.glosses}));
  const num=p.numbered===false?'':'<i class="pn">'+esc(pp.label||idx+1)+'</i>';
  const tb=pp.trans?'<button class="tbtn" data-act="trans" data-k="'+esc(pp.key)+'">译</button>':'';
  const tr=pp.trans&&state.openTrans[pp.key]?'<div class="trans">'+md(pp.trans)+'</div>':'';
  return '<div class="para" data-pk="'+esc(pp.key)+'">'+num+'<span class="pt">'+body+'</span>'+tb+tr+'</div>';
}

/* ---------- 左栏 ---------- */
function renderLeft(){
  const el=$('#left'),keep=el.scrollTop,s=sec(),q=curQ();let h='';
  $('.cols').classList.remove('solo');
  if(s.type==='dictation'||(q&&q.type==='dictation'&&!s.passages.length)){
    h='<div class="lcard"><div class="ltabs"><button class="on">'+esc(s.title)+' · 全题</button></div><div class="lbody">';
    s.questions.forEach((qq,qi)=>{
      h+='<div style="margin-bottom:12px"><div class="chips"><b>第 '+qq.no+' 题</b><span class="chip">'+esc(qq.kind||'默写')+'</span><span class="chip amber">'+qq.score+' 分</span></div>';
      (qq.subs||[]).forEach((sub,si)=>{
        const on=qi===state.qi&&(state.subIdx[qq.id]||0)===si;
        h+='<div class="jump'+(on?' on':'')+'" data-act="subjump" data-i="'+qi+'" data-s="'+si+'"><b>'+(si+1)+'</b><span>'+esc(String(sub.stem).replace(/\n/g,' '))+'</span></div>';
      });
      h+='</div>';
    });
    el.innerHTML=h+'</div></div>';el.scrollTop=keep;return;
  }
  if(q&&q.type==='writing'){
    h='<div class="lcard"><div class="ltabs"><button class="on">作文题 · 材料</button></div><div class="lbody">'
     +'<div class="chips"><span class="chip solid">第 '+q.no+' 题</span><span class="chip">写作</span><span class="chip amber">'+q.score+' 分</span></div>'
     +'<div class="stem">'+md(q.stem)+'</div>'
     +(q.material?'<div class="tipbox" style="font-size:.95em;line-height:2;color:var(--ink)">'+md(q.material)+'</div>':'')
     +(q.requirements?'<div class="tipbox">'+md(q.requirements)+'</div>':'')+'</div></div>';
    el.innerHTML=h;el.scrollTop=keep;return;
  }
  const p=passageOf(q);
  if(!p){$('.cols').classList.add('solo');el.innerHTML='';return;}
  const hasTrans=(p.paragraphs||[]).some(x=>x.trans),stuLock=state.mode==='student'&&!(q&&revealed(q));
  const tabs=[['text','原文']];
  if(hasTrans)tabs.push(['trans','对照译文']);
  if(p.structure&&!stuLock)tabs.push(['struct','结构脉络']);
  if(p.approach&&!stuLock)tabs.push(['approach','做题思路']);
  if(!tabs.some(t=>t[0]===state.leftTab))state.leftTab='text';
  h='<div class="lcard"><div class="ltabs">'+tabs.map(t=>'<button class="'+(state.leftTab===t[0]?'on':'')+'" data-act="ltab" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'</div><div class="lbody">';
  h+='<div class="chips">'+(p.genre?'<span class="chip">'+esc(p.genre)+'</span>':'')+(p.tag?'<span class="chip amber">'+esc(p.tag)+'</span>':'')+'</div>';
  h+='<div class="ptitle">'+esc(p.title||'')+'</div>'+(p.byline?'<div class="byline">'+esc(p.byline)+'</div>':'');
  if(state.leftTab==='text'){
    if(p.reading_tip)h+='<div class="tipbox">'+md(p.reading_tip)+'</div>';
    if((p.glosses||[]).length)h+='<div class="legend"><b>点词看释义</b><span>单字 · 虚线</span><span>双音词 · 点线</span><span>点划线处展开</span></div>';
    (p.paragraphs||[]).forEach((pp,i)=>{h+=paraHTML(p,pp,i)});
  }else if(state.leftTab==='trans'){
    h+='<table class="ptable">';
    (p.paragraphs||[]).forEach((pp,i)=>{
      if(!pp.trans)return;
      h+='<tr><td><small>'+esc(pp.label?'原文 · '+pp.label:(p.kind==='poem'?'原句 · 第'+(i+1)+'句':'原文 · 第'+(i+1)+'段'))+'</small>'+esc(pp.text)+'</td><td><small>译文</small>'+md(pp.trans)+'</td></tr>';
    });
    h+='</table>';
    if((p.notes||[]).length)h+='<div class="notes">'+p.notes.map((n,i)=>CN[i]+' '+esc(n)).join('<br>')+'</div>';
  }else if(state.leftTab==='struct'){
    if(p.thread)h+='<div class="thread"><b>主线</b>'+md(p.thread)+'</div>';
    h+='<div class="flow">'+(p.structure||[]).map(x=>'<div class="step"><b>'+esc(x.label)+'</b>'+(x.paras?'　<small>'+esc(x.paras)+'</small>':'')+'<div>'+md(x.text)+'</div></div>').join('')+'</div>';
  }else if(state.leftTab==='approach'){
    const a=p.approach||{};
    h+='<div class="appr"><h3>'+esc(a.title||'做题思路')+'</h3>'+((a.chips||[]).length?'<div class="chips">'+a.chips.map(c=>'<span class="chip">'+esc(c)+'</span>').join('')+'</div>':'')
      +'<dl>'+(a.items||[]).map(i=>'<dt>'+esc(i.label)+'</dt><dd>'+md(i.text)+'</dd>').join('')+'</dl>'
      +((a.pitfalls||[]).length?'<div class="warn"><b>常见误区</b>'+a.pitfalls.map(md).join('　·　')+'</div>':'')+'</div>';
  }
  el.innerHTML=h+'</div></div>';el.scrollTop=keep;
  if(state.scrollLoc){state.scrollLoc=false;const m=el.querySelector('.loc');if(m)setTimeout(()=>m.scrollIntoView({block:'center',behavior:'smooth'}),40)}
}

/* ---------- 右栏 ---------- */
function qCard(q,withFoot){
  const rev=revealed(q);let h='<div class="rcard" id="qc-'+esc(q.id)+'">';
  const gi=ALLQ.indexOf(q)+1;
  const pn=(String(q.no).replace(/[^\d]/g,'')||String(gi));
  h+='<div class="qhead"><span class="no">'+(pn.length<2?'0':'')+pn+'</span>'
    +'<div class="qmeta"><div class="qkind">第 '+esc(q.no)+' 题'+(q.kind?' · '+esc(q.kind):'')+'</div>'
    +'<div class="qchips"><span class="chip amber">'+q.score+' 分</span>'
    +(q.approach?'<span class="chip">技巧</span>':'')
    +(q.tag?'<span class="chip red">'+esc(q.tag)+'</span>':'')
    +'</div></div>'
    +(q.difficulty?'<span class="diff">'+esc(q.difficulty)+'</span>':'')
    +'<button class="star'+(isStar(q)?' on':'')+'" data-act="star" data-q="'+esc(q.id)+'" title="标为重点题">'+(isStar(q)?'★':'☆')+'</button></div>';
  if(q.type!=='writing')h+='<div class="stem">'+md(q.stem)+'</div>';
  if(q.type==='choice')h+=optionsHTML(q,rev);
  else if(q.type==='dictation')h+=dictHTML(q);
  else if(q.type==='writing')h+=writingHTML(q);
  else if(state.mode==='student')h+='<textarea data-bind="text" data-k="'+esc(q.id)+'" placeholder="在这里写下你的答案…">'+esc(state.text[q.id]||'')+'</textarea>';
  if(q.type!=='dictation'&&q.type!=='writing'){
    h+='<div class="acts">';

function diffHTML(b,val){
  if(blankOK(b,val))return esc(val);
  const A=Array.from(normalize(b.answer)),chars=Array.from(String(val||'')),idx=[];
  chars.forEach((c,i)=>{if(normalize(c))idx.push(i)});
  const S=idx.map(i=>chars[i]),m=lcsMask(S,A),bad=new Set();
  idx.forEach((ci,k)=>{if(!m[0][k])bad.add(ci)});
  let out=chars.map((c,i)=>bad.has(i)?'<span class="wrong">'+esc(c)+'</span>':esc(c)).join('');
  const miss=m[1].filter(x=>!x).length;
  return out+(miss?'<span class="miss">（漏写 '+miss+' 字）</span>':'');

let searchQ='';
function searchHits(term){
  const out=[],t=term.toLowerCase();
  E.sections.forEach(s=>{
    s.passages.forEach(p=>(p.paragraphs||[]).forEach(pp=>{
      const hay=String(pp.text||'');const k=hay.toLowerCase().indexOf(t);
      if(k>=0)out.push({kind:'原文 · '+s.title,tag:p.title||'',text:hay,hit:term,si:s._i,qi:findQ(s,p),pk:pp.key});
    }));
    s.questions.forEach(q=>{
      const hay=[q.stem,q.answer_text,q.analysis,(q.answer||''),(q.approach||[]).join(' '),(q.pitfalls||[]).join(' '),
        (q.options||[]).map(o=>o.key+' '+o.text+' '+(o.analysis||'')).join(' ')].filter(Boolean).join('\n');
      if(hay.toLowerCase().indexOf(t)>=0)out.push({kind:'题目 · '+s.title,tag:'第 '+q.no+' 题',text:hay,hit:term,si:q._si,qi:q._qi});
    });
  });
  return out.slice(0,50);
}
function findQ(s,p){const i=s.questions.findIndex(q=>(q.passage||s.passages[0]&&s.passages[0].id)===p.id);return i<0?0:i}
function snip(text,term){
  const k=text.toLowerCase().indexOf(term.toLowerCase());
  if(k<0)return esc(text.slice(0,80));
  const s=Math.max(0,k-34),e=Math.min(text.length,k+term.length+56);

function beep(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const ac=new C();[0,.28,.56].forEach((d,i)=>{const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=i===2?880:660;o.connect(g);g.connect(ac.destination);
      g.gain.setValueAtTime(.0001,ac.currentTime+d);g.gain.exponentialRampToValueAtTime(.25,ac.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d+.22);
      o.start(ac.currentTime+d);o.stop(ac.currentTime+d+.24)});
  }catch(e){}
}

const speechOK=()=>'speechSynthesis' in window;
function pickVoice(){
  if(!speechOK())return null;
  const vs=speechSynthesis.getVoices()||[];
  return vs.find(v=>/zh[-_]?CN|zh[-_]?Hans|Chinese/i.test(v.lang+' '+v.name))||vs.find(v=>/zh/i.test(v.lang))||null;
}
function speak(text){
  if(!speechOK()){toast('当前浏览器不支持朗读，建议用 Edge 或 Chrome');return}
  if(!text||!text.trim()){toast('这一项没有可朗读的内容');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN';u.rate=state.speak.rate;const v=pickVoice();if(v)u.voice=v;
  u.onend=()=>{if(!state.speak.paused){state.speak.on=false;$('#speakbar').hidden=true;updateDock()}};
  u.onerror=()=>{state.speak.on=false;$('#speakbar').hidden=true;updateDock()};
  state.speak.on=true;state.speak.paused=false;state.speak.text=text;
  $('#speakbar').hidden=false;updateDock();

}
function speakTarget(k){
  const q=curQ();if(!q)return;
  if(k==='passage'){
    const p=passageOf(q);if(!p||!(p.paragraphs||[]).length){speakTarget('q');return}
    speak((p.title?p.title+'。':'')+(p.paragraphs||[]).map(x=>x.text).join('\n'));
  }else if(k==='q'){
    speak([q.stem,(q.options||[]).map(o=>o.key+'，'+o.text).join('；'),(q.subs||[]).map(s=>s.stem).join('；')].filter(Boolean).join('\n'));
  }else{
    const parts=[];
    if(q.type==='choice')parts.push('答案 '+ansSet(q).join(''));
    if(q.answer_text)parts.push(q.answer_text);
    if((q.points||[]).length)parts.push((q.points||[]).join('；'));
    if(q.analysis)parts.push(q.analysis);
    if(q.type==='dictation')parts.push((q.subs||[]).map((s,i)=>'第'+(i+1)+'问 '+s.blanks.map(b=>b.answer).join('，')).join('。'));
    if(!parts.length)parts.push(q.writing&&q.writing.analysis?q.writing.analysis.summary||'':'这道题暂无文字答案');
    speak(parts.join('\n'));
  }
}

function sizeBoard(){

function redrawBoard(){
  bctx.setTransform(1,0,0,1,0,0);

  bctx.scale(bdpr,bdpr);
  const q=curQ(),list=(state.board.strokes[q?q.id:'_']||[]);

    bctx.globalCompositeOperation=st.erase?'destination-out':'source-over';
    bctx.strokeStyle=st.color;bctx.lineWidth=st.size;bctx.lineCap='round';bctx.lineJoin='round';
    bctx.beginPath();
    st.pts.forEach((p,i)=>i?bctx.lineTo(p.x,p.y):bctx.moveTo(p.x,p.y));
    if(st.pts.length===1){bctx.lineTo(st.pts[0].x+.1,st.pts[0].y+.1)}
    bctx.stroke();
  });
  bctx.globalCompositeOperation='source-over';
}

  if(e.key==='ArrowUp'){if(state.si>0){go(state.si-1,0);render();redrawBoard()}return}
  if(k==='f'){tool('fullscr');return}
  if(k==='b'){tool('board');return}
  if(k==='l'){tool('speak');return}
  if(k==='s'){tool('sheet');return}
  if(k==='n'){tool('notes');return}
});

function tool(n){
  const q=curQ();
  switch(n){
    case'mode':state.mode=state.mode==='teacher'?'student':'teacher';resetStudent();state.reveal=false;break;
    case'reveal':if(state.mode==='teacher')state.reveal=!state.reveal;break;
    case'annot':state.annotate=!state.annotate;toast(state.annotate?'标注已开：选中原文即可高亮，双击可取消':'标注已关');break;
    case'locate':if(q&&(q.evidence||[]).length){state.locate[q.id]=!state.locate[q.id];state.leftTab='text';state.scrollLoc=!!state.locate[q.id]}else toast('这道题没有标注原文依据');break;
    case'fsm':state.fs=Math.max(.7,Math.round((state.fs-.1)*10)/10);applyFs();break;
    case'fsp':state.fs=Math.min(1.8,Math.round((state.fs+.1)*10)/10);applyFs();break;
    case'timer':
      if(state.timer.run){clearInterval(state.timer.h);state.timer.run=false}
      else{state.timer.run=true;state.timer.h=setInterval(()=>{state.timer.sec++;updateDock()},1000)}
      break;
    case'countdown':openCd();return;
    case'draw':{const s=sec(),pool=s.questions.map((x,i)=>i).filter(i=>!state.drawn[s.id+i]);
      if(!pool.length){s.questions.forEach((x,i)=>delete state.drawn[s.id+i]);return tool('draw')}
      const i=pool[Math.floor(Math.random()*pool.length)];state.drawn[s.id+i]=1;state.qi=i;state.leftTab='text';state.view='single';toast('抽到：第 '+s.questions[i].no+' 题');break}
    case'cover':$('#cover').hidden=false;return;
    case'fullscr':{
      if(!document.fullscreenElement){(document.documentElement.requestFullscreen||function(){}).call(document.documentElement)} 
      else{document.exitFullscreen&&document.exitFullscreen()}
      return;
    }
    case'speak':
      if(state.speak.on){stopSpeak();return}
      speakTarget('passage');return;
    case'board':boardToggle();return;
    case'sheet':openSheet();return;
    case'search':openSearch();return;
    case'print':openPrint();return;
    case'notes':$('#notes').hidden=!$('#notes').hidden;syncNotes();return;
    case'theme':{
      const i=PAL.indexOf(state.pal);state.pal=PAL[(i+1)%PAL.length];
      applyPal();toast('配色：'+PALNAME[state.pal]);break;
    }
    case'bexport':{exportBoard();return}
    case'fold':{const open=$('#dockbox').hidden;$('#dockbox').hidden=!open;$('#dockmini').classList.toggle('on',open);return}
    case'help':{openHelp();return}
  }
  render();
  redrawBoard();
}
/* 计时器 / 倒计时双击清零 */
document.querySelector('[data-tool="timer"]').addEventListener('dblclick',()=>{clearInterval(state.timer.h);state.timer={run:false,sec:0,h:null};updateDock()});
document.querySelector('[data-tool="countdown"]').addEventListener('dblclick',()=>{clearInterval(state.cd.h);state.cd={run:false,left:0,h:null};updateDock()});
function exportBoard(){
  const c=$('#board');if(!c)return;
  const tmp=document.createElement('canvas');
  tmp.width=c.width;tmp.height=c.height;
  const g=tmp.getContext('2d');
  g.fillStyle=getComputedStyle(document.body).getPropertyValue('--bg')||'#fff';
  g.fillRect(0,0,tmp.width,tmp.height);
  g.drawImage(c,0,0);
  const a=document.createElement('a');
  a.download='板书-'+(curQ()?curQ().no:'')+'.png';
  a.href=tmp.toDataURL('image/png');
  a.click();toast('板书已导出为图片');
}
window.addEventListener('resize',()=>{if(state.board.on)sizeBoard()});
window.addEventListener('beforeprint',fillPrint);
if(window.speechSynthesis)window.speechSynthesis.onvoiceschanged=()=>{};
if(E.meta.cover===true)$('#cover').hidden=false;

/* ---------- 启动 ---------- */
applyPal();applyFs();applyRail();
$('#railtog').addEventListener('click',railToggle);
if(railFirst){const rt=$('#railtog');rt.classList.add('hint');setTimeout(()=>rt.classList.remove('hint'),4400)}
$('#sprate').textContent=state.speak.rate.toFixed(2).replace(/0$/,'')+'×';
render();
const unPre=()=>$('#app').classList.remove('preload');
requestAnimationFrame(()=>requestAnimationFrame(unPre));
setTimeout(unPre,420);
})();
</script>
